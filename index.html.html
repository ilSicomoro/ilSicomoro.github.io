<!DOCTYPE html>
<html lang="it" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Sicomoro | Rifugio di Fede e Storie</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Lora:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FBF9F5;
            --surface-color: #FFFFFF;
            --surface-alt: #F3EFEA;
            --text-primary: #2C2623;
            --text-secondary: #635A52;
            --accent-primary: #7A1C29; /* Bordeaux Sacrale */
            --accent-hover: #5E141F;
            --gold: #C5A059; /* Oro Antico */
            --border-color: #E6E0D5;
            --shadow: 0 10px 30px rgba(122, 28, 41, 0.06);
            --transition: all 0.3s ease;
        }

        [data-theme="dark"] {
            --bg-color: #161413;
            --surface-color: #211E1C;
            --surface-alt: #2C2724;
            --text-primary: #F4EFE6;
            --text-secondary: #B8B0A5;
            --accent-primary: #9E2B3A;
            --accent-hover: #BD3B4B;
            --gold: #D4AF37;
            --border-color: #38322E;
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            line-height: 1.7;
            transition: var(--transition);
        }

        h1, h2, h3, .brand-title {
            font-family: 'Cinzel', serif;
        }

        /* Header & Navigation */
        header {
            background-color: var(--surface-color);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: var(--shadow);
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .cross-icon {
            font-size: 1.8rem;
            color: var(--gold);
        }

        .brand-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--accent-primary);
            letter-spacing: 0.5px;
        }

        .brand-subtitle {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: 'Plus Jakarta Sans', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 1.5rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-primary);
            font-weight: 500;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--accent-primary);
        }

        .theme-toggle, .admin-btn {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.5rem 1rem;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
        }

        .theme-toggle:hover, .admin-btn:hover {
            border-color: var(--gold);
            background: var(--accent-primary);
            color: white;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(135deg, rgba(122,28,41,0.05) 0%, rgba(197,160,89,0.08) 100%), var(--surface-color);
            padding: 4rem 2rem;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
        }

        .hero-content {
            max-width: 800px;
            margin: 0 auto;
        }

        .holy-symbol {
            font-size: 2.5rem;
            color: var(--gold);
            margin-bottom: 1rem;
        }

        .hero h1 {
            font-size: 2.5rem;
            color: var(--accent-primary);
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-secondary);
            font-family: 'Lora', serif;
            margin-bottom: 2rem;
            font-style: italic;
        }

        /* Search & Filter Bar */
        .search-filter-container {
            max-width: 800px;
            margin: -1.5rem auto 2rem auto;
            padding: 0 1.5rem;
            position: relative;
            z-index: 10;
        }

        .search-box {
            display: flex;
            background: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: 50px;
            padding: 0.5rem 1rem;
            box-shadow: var(--shadow);
            align-items: center;
        }

        .search-box input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 0.5rem;
            font-size: 1rem;
            color: var(--text-primary);
            outline: none;
        }

        .filter-tags {
            display: flex;
            gap: 0.5rem;
            justify-content: center;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .tag-btn {
            background: var(--surface-alt);
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            cursor: pointer;
            color: var(--text-secondary);
            transition: var(--transition);
        }

        .tag-btn.active, .tag-btn:hover {
            background: var(--accent-primary);
            color: white;
            border-color: var(--accent-primary);
        }

        /* Main Container */
        .container {
            max-width: 1200px;
            margin: 3rem auto;
            padding: 0 2rem;
        }

        section {
            margin-bottom: 4rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.75rem;
        }

        .section-header h2 {
            font-size: 1.8rem;
            color: var(--accent-primary);
        }

        .section-header span {
            color: var(--gold);
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Grid Cards */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 2rem;
        }

        .card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--gold);
        }

        .card-meta {
            font-size: 0.8rem;
            color: var(--gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .card h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .card p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
            font-family: 'Lora', serif;
        }

        .btn-primary {
            background: var(--accent-primary);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary:hover {
            background: var(--accent-hover);
        }

        /* Prayer Wall & Submissions */
        .prayer-wall-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media(max-width: 768px) {
            .prayer-wall-grid {
                grid-template-columns: 1fr;
            }
        }

        .form-card {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 2rem;
            box-shadow: var(--shadow);
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .form-group textarea, .form-group input {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border-color);
            background: var(--bg-color);
            color: var(--text-primary);
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            outline: none;
        }

        .form-group textarea:focus, .form-group input:focus {
            border-color: var(--gold);
        }

        .prayer-item {
            background: var(--surface-alt);
            border-left: 4px solid var(--gold);
            padding: 1.25rem;
            border-radius: 0 8px 8px 0;
            margin-bottom: 1rem;
        }

        .prayer-item p {
            font-family: 'Lora', serif;
            font-style: italic;
            margin-bottom: 0.75rem;
        }

        .prayer-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
        }

        .pray-counter-btn {
            background: transparent;
            border: 1px solid var(--accent-primary);
            color: var(--accent-primary);
            padding: 0.3rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: var(--transition);
        }

        .pray-counter-btn:hover {
            background: var(--accent-primary);
            color: white;
        }

        /* Q&A Section */
        .qa-item {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: var(--shadow);
        }

        .question-title {
            font-weight: 700;
            color: var(--accent-primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .answer-box {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 1px dashed var(--border-color);
            font-family: 'Lora', serif;
            color: var(--text-secondary);
        }

        /* Admin Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 2000;
            padding: 1rem;
        }

        .modal-content {
            background: var(--surface-color);
            border-radius: 16px;
            width: 100%;
            max-width:
